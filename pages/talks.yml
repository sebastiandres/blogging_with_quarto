# Talks data — single source of truth for pages/charlas.qmd
#
# Each entry renders as a card (front: image, date, event, title) that opens a
# modal (full description + links). Order newest-first; that's the display order.
#
# Fields:
#   title          (required)  Spanish title / default.
#   title_en       (optional)  English title; falls back to `title`.
#   date           (required)  YYYY-MM-DD (or YYYY-MM). Shown on the card.
#   event          (required)  Event name shown on the card.
#   image          (optional)  Path relative to this folder (pages/). If absent,
#                              a gradient placeholder with the event name is used.
#   description    (required)  Spanish body / default (modal text).
#   description_en (optional)  English body; falls back to `description`.
#   links          (optional)  List of {text, href} shown as buttons in the modal.
#   venues         (optional)  For talks given at several events. List of
#                              {event, date, video?}. When present it's shown in
#                              the modal under "Presented at".

- title: "Python y Data Storytelling al rescate: evitemos más muertes por PowerPoint"
  title_en: "Python and Data Storytelling to the rescue: let's prevent more deaths by PowerPoint"
  date: "2024-09-24"
  event: "Nerdearla"
  image: "images/talks/storytelling.png"
  description: >
    Se discuten distintas habilidades de data storytelling y herramientas
    técnicas con el objetivo de crear presentaciones más atractivas, entretenidas
    y memorables usando librerías y programas en python. ¡Hagamos el mundo mejor,
    una presentación a la vez!
  description_en: >
    I discuss different data storytelling skills and technical tools with the
    goal of creating more engaging, entertaining and memorable presentations
    using python libraries and programs. Let's make the world better, one
    presentation at a time!
  links:
    - { text: repo, href: "https://github.com/sebastiandres/talk_2024_05_pycon_us" }
  venues:
    - { event: "PyCon US 2024", date: "2024-05-20", video: "https://www.youtube.com/watch?v=KknQ_VzbJY0" }
    - { event: "Python Chile Meetup", date: "2024-05-29", video: "https://youtu.be/vgkOTFfJvPc&t=193" }
    - { event: "Nerdearla", date: "2024-09-24", video: "https://www.youtube.com/watch?v=JbUV8mkn6v0" }

