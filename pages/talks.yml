- title: "¿Cómo hacer Data Storytelling con Python?"
  title_en: "How to do Data Storytelling with Python?"
  date: "2023-11-25"
  event: "PyCon Chile 2023"
  image: "images/talks/pycon-chile.png"
  description: >
    En esta keynote recorremos el poco explorado territorio del Data Storytelling
    en Python. Iremos más allá de las tablas y los gráficos, y exploraremos cómo
    tus datos pueden ser contados de manera convincente y emocionante. Descubrirás
    el arte y las herramientas disponibles en Python para tejer relatos que llamen
    al cambio y la acción.
  description_en: >
    In this keynote we explore the little-charted territory of Data Storytelling
    in Python. We go beyond tables and charts, and explore how your data can be
    told in a compelling and exciting way. You'll discover the art and the tools
    available in Python to weave stories that call for change and action.
  links:
    - { text: repo, href: "https://github.com/sebastiandres/talk_2023_11_25_pycon_chile" }
    - { text: video, href: "https://www.youtube.com/watch?v=X1xcyY9Y0Pc&t=26980s" }

- title: "Vizzualización de Datos"
  title_en: "Data Vizzualization"
  date: "2023-09-07"
  event: "PyDay Chile 2023"
  image: "images/talks/pyday-chile.webp"
  description: >
    En esta charla explico la importancia de la visualización y cómo se usa la
    librería [ipyvizzu](https://ipyvizzu.vizzuhq.com/). Vizzu es una librería
    para python y javascript, que permite realizar animaciones entre gráficos.
  description_en: >
    In this talk I explain the importance of visualization and how to use the
    [ipyvizzu](https://ipyvizzu.vizzuhq.com/) library. Vizzu is a library for
    python and javascript that lets you create animations between charts.
  links:
    - { text: repo, href: "https://github.com/sebastiandres/talk_2023_09_07_vizzu" }
    - { text: video, href: "https://youtu.be/xjwkJzBTdNI?t=4044" }

