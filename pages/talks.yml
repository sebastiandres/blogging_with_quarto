- title: "WebApps con Streamlit: ¡más fácil que la tabla del uno, poh!"
  title_en: "WebApps with Streamlit: easier than the one-times table, dude!"
  date: "2021-11-07"
  event: "PyCon Chile 2021"
  image: "images/talks/pycon-chile.png"
  description: >
    Si alguna vez te has dicho "debería haber una manera más fácil de compartir
    este script/análisis/código con otras personas", streamlit es la librería que
    estabas esperando. Esta charla te mostrará cómo comenzar a usar streamlit.
  description_en: >
    If you've ever told yourself "there should be an easier way to share this
    script/analysis/code with other people", streamlit is the library you were
    waiting for. This talk will show you how to start using streamlit.
  links:
    - { text: repo, href: "https://github.com/sebastiandres/talk_2021_11_pyconcl" }
    - { text: video, href: "https://www.youtube.com/watch?v=cZSzK2uIqjY" }

- title: "Presentaciones Interactivas con Jupyter Notebook + RISE"
  title_en: "Interactive Presentations with Jupyter Notebook + RISE"
  date: "2021-08-28"
  event: "PyCon Latam 2021"
  image: "images/talks/pycon-latam.svg"
  description: >
    Todo lo que necesitas saber en 30 minutos. En esta charla resumí los
    conocimientos que necesitas para hacer una presentación completamente
    interactiva (código, gráficos, encuestas, otros) usando jupyter notebook y
    su extensión RISE.
  description_en: >
    Everything you need to know in 30 minutes. In this talk I summarized the
    knowledge you need to make a fully interactive presentation (code, charts,
    polls, and more) using jupyter notebook and its RISE extension.
  links:
    - { text: repo, href: "https://github.com/sebastiandres/talk_2021_08_pylatam/" }
    - { text: video, href: "https://www.youtube.com/watch?v=VxdnVOt5K1w" }

