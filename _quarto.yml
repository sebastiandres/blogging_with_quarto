project:
  title: "Sebastian Flores Benner"
  type: website

execute:
  freeze: auto  # re-render only when the source file changes

format:
  html:
    include-in-header:
      text: |
        <link rel="alternate" hreflang="es" href="https://sebastiandres.xyz/" />
        <link rel="alternate" hreflang="en" href="https://sebastiandres.xyz/en/" />
        <link rel="alternate" hreflang="x-default" href="https://sebastiandres.xyz/" />
    include-after-body:
      file: lang-switch.html

profile:
  default: esp
  group: [esp, eng]